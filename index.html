<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广东 3+证书 数学技能树</title>
<meta name="description" content="广东 3+证书（高职高考）数学技能树：11 个领域 108 个技能，按往年卷面分值排优先级，配 B站 教学视频和 213 道练习题，可做可打印。">
<meta name="theme-color" content="#0c1017">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1017'/%3E%3Ctext x='32' y='46' font-size='36' text-anchor='middle' fill='%235b8fd6' font-family='sans-serif'%3E%E6%95%B0%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="广东 3+证书 数学技能树">
<meta property="og:description" content="11 个领域 108 个技能，按往年分值排优先级，配教学视频和 213 道练习题。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://woxiao498.github.io/cs-math-skill-tree/">
<meta property="og:image" content="https://woxiao498.github.io/cs-math-skill-tree/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#0c1017; --bg2:#11161f; --panel:#141a24; --line:#232d3d;
    --txt:#dfe6f0; --txt2:#93a3b8; --txt3:#7d92aa;
    --a:#e2604f; --b:#d69a3c; --c:#4f86c6; --d:#4a5566;
    --accent:#5b8fd6;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1000px 600px at 15% -10%, #16202e 0%, transparent 60%),
      radial-gradient(900px 500px at 95% 0%, #1a1526 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:16px 24px 12px;border-bottom:1px solid var(--line);
    background:rgba(12,16,23,.82);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:30;
  }
  .brand h1{margin:0;font-size:17px;letter-spacing:.4px;font-weight:650}
  .brand h1 em{font-style:normal;color:var(--accent)}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--txt3);letter-spacing:.3px}
  .search-wrap{flex:1;min-width:260px;max-width:380px}
  #search{
    width:100%;padding:7px 12px;border-radius:8px;
    background:#0e131b;border:1px solid var(--line);color:var(--txt);font-size:13px;
  }
  #search:focus{outline:none;border-color:var(--accent)}
  /* 键盘焦点：原来全站唯一的 focus 规则是把输入框的 outline 去掉，
     等于 Tab 过去看不出焦点在哪。这里补回来。 */
  :focus-visible{outline:2px solid #5b8fd6;outline-offset:2px}
  #search:focus-visible{outline:2px solid #5b8fd6;outline-offset:1px}
  .node:focus-visible,.dom-card:focus-visible,.rank-row:focus-visible,
  .lcard:focus-visible,.chip:focus-visible{outline:2px solid #5b8fd6;outline-offset:2px}
  .top-actions{display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap}
  .btn{
    padding:6px 12px;border:1px solid var(--line);border-radius:7px;color:var(--txt2);
    background:#101620;transition:.15s;font-size:12.5px;
  }
  .btn:hover{border-color:#3a4d68;color:var(--txt)}
  .btn.on{background:#1c3350;border-color:#2f5480;color:#dbe9f8;font-weight:600}
  .toggle{display:flex;align-items:center;gap:6px;color:var(--txt2);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}

  /* ---------- 进度条 ---------- */
  /* 进度：不再是一条通栏加载条 —— 那是浏览器在下载东西的视觉语言 */
  .progressbar{position:relative;height:auto;background:none;border-bottom:1px solid var(--line);
    padding:8px 24px 9px;display:flex;align-items:center;gap:10px}
  .progressbar::before{content:"";flex:1;height:2px;border-radius:1px;background:#1a2331}
  #pbar-fill{position:absolute;left:24px;top:50%;margin-top:-2px;height:2px;width:0;
    border-radius:1px;background:linear-gradient(90deg,#2c4a6e,#5b8fd6);transition:width .35s;
    max-width:calc(100% - 48px)}
  #pbar-text{position:static;font-size:11px;color:var(--txt3);letter-spacing:.3px;white-space:nowrap}

  /* ---------- 布局 ---------- */
  .layout{display:flex;align-items:stretch;min-height:calc(100vh - 122px)}
  main{flex:1;min-width:0;overflow:auto;padding:22px 24px 40px}
  aside#panel{
    width:392px;flex:0 0 392px;border-left:1px solid var(--line);
    background:rgba(16,21,29,.6);overflow:auto;padding:20px;
  }
  @media (max-width:1080px){
    .layout{flex-direction:column}
    aside#panel{width:auto;flex:none;border-left:none;border-top:1px solid var(--line)}
  }

  .sec-title{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;flex-wrap:wrap}
  .sec-title h2{flex:0 1 auto;min-width:0}
  .sec-title h2{margin:0;font-size:15px;font-weight:620}
  .sec-title span{font-size:12px;color:var(--txt3)}
  .crumbs{font-size:12px;color:var(--txt3);margin-bottom:16px;display:flex;gap:8px;align-items:center}
  .crumbs a{color:var(--txt2);text-decoration:none;cursor:pointer}
  .crumbs a:hover{color:var(--accent)}

  /* ---------- 领域总览 ---------- */
  .dom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
  .dom-card{
    position:relative;padding:15px 16px 13px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#151b26,#121821);border:1px solid var(--line);
    transition:.18s;overflow:hidden;
    display:flex;flex-direction:column;   /* 描述行数不一时，底行也要对齐在同一条线上 */
  }
  .dom-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dc);opacity:.75}
  .dom-card:hover{border-color:#33445c;transform:translateY(-2px);box-shadow:0 10px 26px -14px #000}
  .dom-card h3{margin:0 0 3px;font-size:14.5px;font-weight:620;color:#e8eef7}
  .dom-card .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--txt3);margin-bottom:8px;flex-wrap:wrap}
  .dom-card .desc{font-size:12px;color:var(--txt2);line-height:1.55;min-height:54px}
  .dom-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;font-size:11px;color:var(--txt3)}
  .mini-bar{height:3px;border-radius:2px;background:#0c1119;flex:1;margin:0 10px;overflow:hidden}
  .mini-bar i{display:block;height:100%;background:var(--dc);width:0}

  .rank-badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:19px;height:19px;padding:0 5px;border-radius:5px;
    font-size:10.5px;font-weight:700;letter-spacing:.3px;
  }
  .lv-A{background:rgba(226,96,79,.16);color:var(--a);border:1px solid rgba(226,96,79,.35)}
  .lv-B{background:rgba(214,154,60,.14);color:var(--b);border:1px solid rgba(214,154,60,.3)}
  .lv-C{background:rgba(79,134,198,.14);color:var(--c);border:1px solid rgba(79,134,198,.3)}
  .lv-D{background:rgba(74,85,102,.2);color:#7c8ba1;border:1px solid rgba(74,85,102,.4)}

  .tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#1b2431;color:var(--txt3);border:1px solid #26313f}
  .tag.q{color:#8fa8c4;border-color:#2c3a4d}

  /* ---------- 地图 ---------- */
  .map-wrap{position:relative;overflow:auto;border:1px solid var(--line);border-radius:12px;
    background:
      linear-gradient(#0e131b,#0e131b),
      radial-gradient(circle at 20% 20%, #1a2433, transparent 40%);
    background-blend-mode:normal;
  }
  .map-inner{position:relative}
  svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .edge{fill:none;stroke:#2b3646;stroke-width:1.4;transition:.2s}
  .edge.soft{stroke-dasharray:4 5;stroke:#212a38}
  .edge.hl-hard{stroke:#5b8fd6;stroke-width:2.4}
  .edge.hl-soft{stroke:#5b8fd6;stroke-width:2;stroke-dasharray:4 5;opacity:.8}

  .step-head{position:absolute;font-size:10.5px;color:var(--txt3);letter-spacing:1px}
  .step-head b{color:#7f93ab;font-weight:600}

  .node{
    position:absolute;border-radius:9px;padding:8px 10px;cursor:pointer;
    background:#161d28;border:1px solid #2f3d52;
    transition:.16s;display:flex;flex-direction:column;justify-content:center;gap:2px;
    overflow:hidden;
  }
  .node:hover{border-color:#41546e;background:#1a2230}
  .node .nm{font-size:11.5px;font-weight:600;color:#dbe4f0;line-height:1.26;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .node .sub{font-size:10px;color:var(--txt3);display:flex;gap:5px;align-items:center}
  .node .dot{position:absolute;right:9px;top:9px;width:7px;height:7px;border-radius:50%;
    background:transparent;border:1.5px solid #52657e}
  .node.lit{background:linear-gradient(160deg,#17253a,#14202f);border-color:var(--nc);box-shadow:0 0 0 1px rgba(91,143,214,.25),0 8px 20px -12px var(--nc)}
  .node.lit .dot{background:var(--nc);border-color:var(--nc);box-shadow:0 0 8px var(--nc)}
  /* 锁定：虚线 + 名字压暗 + 冷色锁块。
     这里不能用红色 —— 红在这站里是「错题 / 答错 / 到期」，锁是状态不是错误。 */
  .node.locked{border-style:dashed;border-color:#26303d}
  .node.locked .nm{color:#6b7d92}
  .node.locked .dot{background:#52657e;border-color:#52657e;border-radius:2px}
  .node.sel{border-color:#8fb4e8 !important;box-shadow:0 0 0 2px rgba(143,180,232,.35),0 0 22px -4px #4d7fb8}
  .node.hl{border-color:#4d7fb8}
  .node.dimmed{opacity:.24}
  /* 可跳过：用斜纹底，别用 opacity —— 那在界面语言里是「禁用」，跟它「能点只是不推荐」正好反 */
  .node.skippable{background:repeating-linear-gradient(135deg,#161d28 0 4px,#1a222e 4px 8px)}
  .node.skippable .nm{color:#93a3b8}
  .node .ext{position:absolute;left:8px;bottom:4px;font-size:9px;color:#4a5c73}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--txt3);margin:0 0 14px}
  .legend i{display:inline-block;width:22px;height:0;border-top:2px solid #33415a;vertical-align:middle;margin-right:5px}
  .legend i.dash{border-top-style:dashed}
  .swipe-hint{margin:0 0 10px;font-size:11.5px;color:#7d92aa}
  .map-wrap{-webkit-overflow-scrolling:touch}
  /* 图例做成「节点的缩小版」，不是一个勾选框 */
  .legend-state span{display:inline-flex;align-items:center;gap:7px;font-size:12px}
  .legend-state i{position:relative;width:52px;height:22px;border-radius:6px;display:inline-block;
    border:1px solid #2f3d52;background:#161d28}
  .legend-state i::after{content:"";position:absolute;right:7px;top:7px;width:6px;height:6px;
    border-radius:50%;border:1.5px solid #52657e;background:transparent}
  .legend-state .lg-lit{background:#17253a;border-color:#5b8fd6}
  .legend-state .lg-lit::after{background:#5b8fd6;border-color:#5b8fd6;box-shadow:0 0 6px #5b8fd6}
  .legend-state .lg-lock{border-style:dashed;border-color:#26303d}
  .legend-state .lg-lock::after{background:#52657e;border-color:#52657e;border-radius:2px}
  .legend-state .lg-skip{background:repeating-linear-gradient(135deg,#161d28 0 4px,#1a222e 4px 8px)}

  /* ---------- 排行 ---------- */
  .rank-row{
    display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;
    border:1px solid transparent;cursor:pointer;transition:.12s;
  }
  .rank-row:hover{background:#141b26;border-color:#28344a}
  .rank-row .nm{font-size:13px;font-weight:560;color:#dbe4f0;min-width:190px}
  .rank-row .dom{font-size:11px;color:var(--txt3);min-width:76px}
  /* 掌握标准不再锁成一行：锁了就出现「左边 300px 文字 + 中间 500px 空白 + 右边标签」 */
  .rank-row .how{font-size:11.5px;color:var(--txt2);flex:1;max-width:560px;line-height:1.5}
  .rank-row .qtags{display:flex;gap:4px;margin-left:auto;flex:0 0 auto}
  .qres{font-size:12.5px;color:#c6d4e6;flex:1;line-height:1.55;max-width:640px}
  .weak-rate{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .rank-group{margin:0 0 8px;font-size:12px;color:var(--txt3);padding:14px 4px 6px;border-bottom:1px solid #1b2431;display:flex;gap:8px;align-items:center}

  /* ---------- 清单 ---------- */
  .plan-list{counter-reset:step}
  .plan-item{display:flex;gap:12px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid #161e29}
  .plan-item .no{
    flex:0 0 26px;height:26px;border-radius:50%;background:#141d2a;border:1px solid #26313f;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#8496ad;font-weight:600;
  }
  .plan-item.done .no{background:#1b3a2c;border-color:#2e6b4d;color:#7ed4a3}
  .plan-item .body{flex:1}
  .plan-item .t{font-size:13px;color:#dbe4f0;font-weight:550}
  .plan-item .d{font-size:11px;color:var(--txt3);margin-top:1px}

  /* ---------- 详情面板 ---------- */
  .empty{color:var(--txt3);font-size:12.5px;text-align:center;padding:60px 20px;line-height:2}
  .empty span{font-size:11px;color:#4a5566}
  .p-head{margin:0 0 4px;font-size:16px;font-weight:650;color:#eaf0f8;line-height:1.35}
  .p-domain{font-size:11.5px;color:var(--txt3);margin-bottom:14px}
  .p-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .p-sec{margin:18px 0 8px;font-size:11px;letter-spacing:1.2px;color:var(--txt3);text-transform:uppercase}
  .p-body{font-size:12.8px;color:#b9c6d8;line-height:1.72}
  .pts{margin:0;padding-left:0;list-style:none}
  .pts li{position:relative;padding-left:15px;margin-bottom:5px;font-size:12.8px;color:#c3cfe0}
  .pts li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--nc,#4a5c73)}
  .p-how{background:#101924;border:1px solid #22344a;border-left:2px solid var(--accent);
    border-radius:6px;padding:9px 11px;font-size:12.4px;color:#c9d8ea}
  .tip{background:#1a1512;border:1px solid #3a2a1e;border-left:2px solid #b5763c;
    border-radius:6px;padding:9px 11px;font-size:12.4px;color:#d9c0a8}
  .pre-chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:11.5px;padding:3px 9px;border-radius:14px;background:#141d29;
    border:1px solid #263243;color:#9db0c7;cursor:pointer;transition:.12s;
  }
  .chip:hover{border-color:#3d5470;color:#d6e3f2}
  .chip.ok{border-color:#2e6b4d;color:#7ed4a3;background:#101d17}
  .chip.miss{border-color:#6b3a34;color:#d69a8a;background:#1c1310}
  .chip.soft{border-style:dashed}
  .p-actions{display:flex;gap:8px;margin:20px 0 6px;flex-wrap:wrap}
  .p-actions .btn{flex:1;text-align:center;padding:9px 12px}
  .btn.lit{background:#1b3a2c;border-color:#2e6b4d;color:#8fe0b3}
  .btn.primary{background:#1c3350;border-color:#2f5480;color:#a9cbef}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .unsure{font-size:11.5px;color:#c9a86a;background:#1a1710;border:1px solid #3a3220;
    border-radius:6px;padding:8px 10px;margin-top:14px;line-height:1.6}

  footer{
    padding:14px 24px 22px;border-top:1px solid var(--line);
    font-size:11px;color:#6b7d92;line-height:1.9;background:#0a0e14;
  }
  footer a{color:#6a819c}
  .kbd{font-size:10.5px;padding:1px 5px;border:1px solid #2a3646;border-radius:4px;color:#8496ad}

  

  /* ---------- 打印练习卷 ---------- */
  .paper{background:#fff;color:#1a1a1a;border-radius:8px;padding:30px 34px;line-height:1.7;
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif}
  .paper .phead h2{margin:0 0 7px;font-size:19px;font-weight:700;letter-spacing:.5px}
  .paper .pmeta{display:flex;gap:18px;font-size:12px;color:#555;flex-wrap:wrap}
  /* 卷头信息栏：每组「标签+下划线」绑在一起，手机上才不会被拆到两行 */
  .paper .pexam-info{display:flex;flex-wrap:wrap;gap:10px 20px;font-size:12px;color:#333;margin:10px 0 4px}
  .paper .pi{display:flex;align-items:flex-end;white-space:nowrap}
  .paper .pi .ul{width:78px;height:15px;border-bottom:1px solid #444;margin-left:6px}
  .paper .pnote{font-size:11.5px;color:#333;margin:12px 0 20px;line-height:1.85}
  .paper .pnote b{display:block;margin-bottom:2px}
  .paper .psec{font-size:14.5px;font-weight:700;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid #ddd}
  .paper .pq{margin-bottom:18px}
  .paper .qt{font-size:15px;line-height:1.8}
  /* 选项用网格，别靠空格排 —— 每题字母到内容的间距都得一样 */
  .paper .po{display:grid;grid-template-columns:repeat(4,1fr);column-gap:14px;row-gap:4px;
    margin:6px 0 0;font-size:14px;color:#222}
  .paper .po span{line-height:1.55}
  .paper .pspace{min-height:170px;border-bottom:1px dashed #ccc;margin-bottom:12px}
  .paper .pkey{margin-top:34px;padding-top:18px;border-top:2px dashed #bbb}
  .paper .pkey h3{font-size:14px;margin:0 0 12px}
  .paper .kgroup{margin-bottom:15px;font-size:12.5px;line-height:1.85}
  .paper .kgroup>b{display:block;margin-bottom:4px}
  .paper .kitem{margin:8px 0;font-size:12.5px}
  .paper .kwhy{color:#666;font-size:11.5px;margin-top:3px}
  .paper .ksteps{color:#8a6a34;font-size:11.5px;margin-top:3px;padding-left:10px;
    border-left:2px solid #d8c39a}
  .paper .kstd{margin-top:6px;font-size:11.5px}
  .paper .kstd summary{cursor:pointer;color:#3f6fa8;user-select:none;outline-offset:2px}
  .paper .kstd div{margin-top:5px;white-space:pre-line;line-height:1.95;color:#2a2a2a;
    padding:9px 11px;background:#f7f7f4;border-left:2px solid #c9c2b4;font-size:12.5px}
  .paper .pnote div{margin-bottom:2px}

  @media print{
    .topbar,.progressbar,aside#panel,footer,.noprint{display:none!important}
    html,body{background:#fff!important}
    .layout{display:block!important}
    main{padding:0!important;overflow:visible!important;max-width:none!important;width:auto!important}
    .paper{padding:0;border-radius:0}
    .paper .pq{page-break-inside:avoid}
    .paper .pkey{page-break-before:always}
    /* 「标准写法」在屏幕上是收起的 <details>，打印时要强制展开，否则带答案的卷子会丢这块 */
    .paper .kstd > div{display:block!important}
    .paper .kstd summary{display:none}
    @page{margin:14mm 12mm}
  }


  /* ---------- 窄屏领域列表（可切换） ---------- */
  .dlist{display:flex;flex-direction:column;gap:16px}
  .dgroup-h{font-size:11px;color:#7d92aa;letter-spacing:1px;margin-bottom:7px;padding-left:2px}
  .dgroup-body{display:flex;flex-direction:column;gap:7px}
  .lcard{background:#111823;border:1px solid #22303f;border-radius:9px;padding:10px 12px;cursor:pointer;transition:.12s}
  .lcard:active{background:#16202c}
  .lcard.lit{border-color:#2e6b4d;background:#10221a}
  .lcard.locked{border-style:dashed;border-color:#26303d;background:#0f1520}
  .lcard.locked .lnm{color:#6b7d92}
  .lcard.locked .lsub{color:#5a6a7d}
  .ltop{display:flex;align-items:center;gap:8px}
  .lnm{font-size:13px;color:#dbe4f0;font-weight:560}
  .lsub{font-size:11px;color:#7d92aa;margin-top:3px;padding-left:26px}

  /* ---------- 数据页 ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:#111823;border:1px solid #22303f;border-radius:10px;padding:14px 12px;text-align:center}
  .kpi b{display:block;font-size:24px;font-weight:800;color:#e6eef8;line-height:1.2;letter-spacing:-1px}
  .kpi b span{font-size:13px;font-weight:600;color:#4f6379}
  .kpi em{display:block;font-style:normal;font-size:11px;color:var(--txt3);margin-top:4px}
  .advice{background:#101a26;border:1px solid #22344a;border-left:3px solid #d69a3c;border-radius:8px;
    padding:11px 14px;font-size:12.8px;color:#c3d2e0;line-height:1.7}
  .advice b{color:#e8c78a}
  .slist{display:flex;flex-direction:column;gap:7px}
  .slist.dim{opacity:.55}
  .srow{display:grid;grid-template-columns:70px 1fr 130px 52px;gap:10px;align-items:center;
    background:#111823;border:1px solid #22303f;border-radius:8px;padding:9px 13px;cursor:pointer}
  .srow:hover{border-color:#2f4260;background:#141d29}
  .sname{font-size:12.5px;font-weight:600;color:#c6d4e4;display:flex;align-items:center;gap:6px}
  .sname i{width:3px;height:12px;border-radius:2px;display:inline-block;flex:0 0 3px}
  .smeta{font-size:11.5px;color:#7d92aa}
  .sbar{height:6px;border-radius:3px;background:#0d141c;overflow:hidden}
  .sbar i{display:block;height:100%;border-radius:3px}
  .sbar i.good{background:#3f9d70}
  .sbar i.mid{background:#b08a3e}
  .sbar i.bad{background:#a85043}
  .sbar i.none{background:#1b2431}
  .slit{font-size:11px;color:var(--txt3);text-align:right}

  /* ---------- 顶栏「更多」 ---------- */
  .more-wrap{position:relative;margin-left:auto}
  .more-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);z-index:60;
    background:#131b26;border:1px solid #2b3a4d;border-radius:10px;padding:6px;
    min-width:158px;max-width:calc(100vw - 32px);
    box-shadow:0 16px 34px -14px #000}
  .more-wrap.open .more-menu{display:block}
  .more-menu .btn{display:block;width:100%;text-align:left;border:none;background:none;
    margin:0;padding:9px 11px;font-size:12px}
  .more-menu .btn:hover{background:#1a2431;border:none}
  .more-check{display:flex;align-items:center;gap:7px;padding:9px 11px;font-size:12px;
    color:var(--txt2);cursor:pointer;border-top:1px solid #1e2836;margin-top:5px}

  /* ---------- 首页焦点：今天只做这一课 ---------- */
  .focus{position:relative;overflow:hidden;border:1px solid #2f5480;border-radius:14px;
    background:linear-gradient(135deg,#17253c,#0f1620 72%);padding:30px 32px}
  .focus::before{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;
    border-radius:50%;background:radial-gradient(circle,#1d4677 0%,transparent 70%);opacity:.55}
  .flabel{position:relative;font-size:12.5px;color:#7fb0e8;letter-spacing:2px;margin-bottom:10px}
  .fname{position:relative;font-size:30px;font-weight:700;color:#eef4fb;letter-spacing:.5px;line-height:1.3}
  .fsub{position:relative;margin-top:7px;font-size:13px;color:#a8bacf;line-height:1.6}
  .fmeta{position:relative;margin-top:9px;font-size:13px;color:#93a3b8}
  .fbtns{position:relative;margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn.fprimary{font-size:15px;padding:12px 26px;background:#2f6ab8;border-color:#3f7fce;color:#fff;font-weight:600}
  .btn.fprimary:hover{background:#3a7bcc}

  /* 首次进入的三句话 */
  .guide{margin-top:18px;border:1px solid #22344a;border-radius:12px;background:#0f1620;padding:18px 20px}
  .guide-h{font-size:12px;color:#7d92aa;letter-spacing:1.5px;margin-bottom:13px}
  .guide-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .guide-row:last-child{margin-bottom:0}
  .guide-row>b{flex:0 0 22px;height:22px;border-radius:50%;background:#1c3350;color:#8fbfee;
    font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600}
  .guide-row>div{font-size:12.5px;color:#a8bacf;line-height:1.65}
  .gt{display:block;color:#dbe7f5;font-weight:600;margin-bottom:2px}

  /* ---------- 今日一课 ---------- */
  .today{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(90deg,#16233a,#111a28);
    border:1px solid #2a4364;border-left:3px solid #5b8fd6;border-radius:10px;
    padding:14px 16px;margin-bottom:12px}
  .tinfo{flex:1;min-width:220px}
  .tinfo b{display:block;font-size:14px;color:#e2ecf8;margin-bottom:3px}
  .tinfo span{font-size:12px;color:#93a3b8;line-height:1.6}
  .tbtn{display:flex;gap:8px;flex-wrap:wrap}
  .hint-line{margin:0 0 14px;padding:9px 12px;border-radius:8px;background:#111a26;
    border:1px solid #22344a;font-size:12.5px;color:#a8bacf;line-height:1.7}
  .hint-line b{color:#7fb0e8;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

  /* ---------- 首页起步引导 ---------- */
  .startbar{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(90deg,#131d2b,#111823);
    border:1px solid #24344a;border-left:3px solid #5b8fd6;border-radius:10px;
    padding:13px 16px;margin-bottom:18px;
  }
  .sbtxt{flex:1;min-width:260px;font-size:12.5px;color:#a8bacf;line-height:1.7}
  .sbtxt b{color:#dfe9f5}
  .sbbtns{display:flex;gap:8px;flex-wrap:wrap}
  .sbbtns .btn.primary{color:#a9cbef;border-color:#2f5480;background:#1c3350}

  /* ---------- 刷题时全宽 ---------- */
  body.no-panel aside#panel{display:none}
  body.quiz-mode aside#panel{display:none}
  body.quiz-mode .layout > main{max-width:880px;width:100%;margin:0 auto}
  /* 打印卷子也要全宽，右侧面板没用 */
  body.paper-mode aside#panel{display:none}
  body.paper-mode .layout > main{max-width:900px;width:100%;margin:0 auto}

  /* ---------- 顶栏角标 ---------- */
  .badge{display:inline-block;min-width:15px;height:15px;line-height:15px;margin-left:5px;
    padding:0 4px;border-radius:8px;background:#b3453a;color:#fff;font-size:10px;font-weight:700;text-align:center}
  .badge:empty{display:none}

  /* ---------- 视频卡 ---------- */
  .vcard{background:#101823;border:1px solid #22303f;border-radius:8px;padding:9px 11px;margin-bottom:8px}
  .vtitle{font-size:12.3px;color:#cfdcec;line-height:1.45;margin-bottom:3px;word-break:break-word}
  .vmeta{font-size:11px;color:var(--txt3);margin-bottom:7px}
  .vbtns{display:flex;gap:6px;flex-wrap:wrap}
  .btn.mini{padding:4px 9px;font-size:11.5px;flex:0 0 auto}
  a.btn{text-decoration:none;display:inline-block;text-align:center;color:var(--txt2)}
  a.btn:hover{color:var(--txt)}
  .player{margin:12px 0;border-radius:10px;overflow:hidden;border:1px solid #22303f;background:#000}
  .player iframe{display:block;width:100%;height:420px;border:0}
  .phint{font-size:11px;color:var(--txt3);padding:7px 10px;background:#0d141c}
  .p-hint{font-size:11.5px;color:#7d92aa;margin-top:8px;line-height:1.5}
  .nextup{margin-top:10px;padding:9px 11px;border-radius:8px;background:#101a26;
    border:1px solid #22344a;border-left:2px solid #5b8fd6;font-size:12px;color:#a8bacf;line-height:1.65}
  .nextup b{color:#7fb0e8;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

  /* ---------- 刷题 ---------- */
  .quiz-head{margin-bottom:16px}
  .quiz-title{font-size:16px;font-weight:650;color:#eaf0f8}
  .quiz-sub{font-size:11.5px;color:var(--txt3);margin-top:3px}
  .quiz-bar{display:flex;gap:3px;margin-top:11px}
  .seg{flex:1;height:4px;border-radius:2px;background:#1b2431}
  .seg-cur{background:#3a5372}
  .seg-ok{background:#2e7d5b}
  .seg-no{background:#8f3b34}
  .qbox{background:#111823;border:1px solid #22303f;border-radius:12px;padding:18px 20px}
  .qtext{font-size:14.5px;line-height:1.75;color:#e2eaf4;margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:flex-start;gap:10px;text-align:left;
    background:#151e2a;border:1px solid #26344a;border-radius:9px;padding:11px 13px;
    transition:.14s;font-size:13px;color:#c6d4e4;width:100%}
  .opt:hover:not(:disabled){border-color:#3d5674;background:#182333}
  .opt:disabled{cursor:default}
  .opt .ol{flex:0 0 20px;height:20px;border-radius:50%;background:#1d2937;border:1px solid #2c3b4d;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#8ba0b8;font-weight:700}
  .opt .ot{flex:1;line-height:1.5}
  .opt.right{border-color:#2e7d5b;background:#10221a}
  .opt.right .ol{background:#2e7d5b;border-color:#2e7d5b;color:#fff}
  .opt.wrong{border-color:#8f3b34;background:#221412}
  .opt.wrong .ol{background:#8f3b34;border-color:#8f3b34;color:#fff}
  .opt.dim{opacity:.45}
  .fb{margin-top:15px;padding:12px 14px;border-radius:9px;font-size:12.8px;line-height:1.65}
  .fb-ok{background:#0f2119;border:1px solid #255c43;color:#a8dcc2}
  .fb-no{background:#211512;border:1px solid #5c2f28;color:#e0b4ac}
  .fb-why{margin-top:7px;color:#c3d2e0;font-size:12.6px}
  .qnav{margin-top:14px;display:flex;justify-content:flex-end}
  .quiz-result{max-width:520px;margin:44px auto;text-align:center}
  .qr-score{font-size:62px;font-weight:800;line-height:1.1;letter-spacing:-2px}
  .qr-score.ok{color:#57c08d}
  .qr-score.no{color:#c9705f}
  .qr-line{font-size:13px;color:#8ba0b8;margin:6px 0 14px}
  .qr-msg{font-size:13px;color:#b9c8d8;line-height:1.75}
  .qr-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  /* 结算页：点亮反馈 + 下一步 + 这次错了哪几题 */
  .qr-lit{margin-top:14px;font-size:14px;color:#6fc79a;font-weight:600;letter-spacing:.5px}
  .qr-next{margin-top:9px;font-size:12.5px;color:#93a3b8}
  .qr-next b{color:#7fb0e8;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .qr-wrong{margin:22px auto 0;max-width:560px;text-align:left}
  .qr-wrong-h{font-size:11.5px;color:#7d92aa;margin-bottom:8px;letter-spacing:.5px}
  .qr-wrow{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:8px;
    background:#111a26;border:1px solid #1e2a38;margin-bottom:6px;cursor:pointer;transition:.12s}
  .qr-wrow:hover{border-color:#2b3a4d;background:#131e2b}
  .qr-wrow .qn{flex:0 0 20px;height:20px;border-radius:50%;background:#2a2026;color:#c08b7e;
    font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .qr-wrow .qt{font-size:12px;color:#b6c6d8;line-height:1.6}
  .qr-wrow .why{display:none;margin-top:7px;font-size:11.5px;color:#93a3b8;line-height:1.75;
    padding-left:9px;border-left:2px solid #2b3a4d}
  .qr-wrow.open .why{display:block}
  .qr-wbody{flex:1}
  .qr-redo{flex:0 0 auto;align-self:flex-start;font-size:11px;padding:5px 10px}

  /* ---------- 模拟考 ---------- */
  .mk-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;padding:11px 16px;margin:-6px 0 18px;border-radius:10px;
    background:rgba(16,22,31,.94);border:1px solid #2a4364;backdrop-filter:blur(6px)}
  .mk-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .mk-label{font-size:11px;color:#7d92aa;letter-spacing:1px}
  .mk-timer{font-size:22px;font-weight:700;color:#dbe7f5;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .mk-answered{font-size:12px;color:#93a3b8}
  .mk-right{display:flex;gap:8px}
  .mk-sec{margin:26px 0 14px;font-size:14px;font-weight:700;color:#dbe7f5;
    padding-bottom:7px;border-bottom:1px solid #1e2a38}
  .mk-q{margin-bottom:20px}
  .mk-qt{font-size:14px;color:#dbe4f0;line-height:1.8;margin-bottom:9px}
  .mk-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .mk-opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:8px;
    background:#111a26;border:1px solid #22303f;cursor:pointer;font-size:13px;
    color:#c6d4e6;line-height:1.55;transition:.12s}
  .mk-opt:hover{border-color:#3a4d68;background:#141e2b}
  .mk-opt.sel{border-color:#5b8fd6;background:#16233a;color:#e8f0fa}
  .mk-opt .ml{flex:0 0 16px;font-weight:700;color:#7fb0e8}
  .mk-input{width:100%;box-sizing:border-box;background:#0f1620;border:1px solid #22303f;
    border-radius:8px;color:#dbe4f0;font-size:13px;padding:9px 11px;font-family:inherit;
    line-height:1.6;resize:vertical}
  .mk-input:focus{outline:none;border-color:#3a5d8c}
  .mk-ans{margin-top:8px;font-size:12px}
  .mk-ans summary{cursor:pointer;color:#5b8fd6;user-select:none}
  .mk-ansbody{margin-top:7px;padding:11px 13px;border-radius:8px;background:#0f1620;
    border-left:2px solid #2a4364;color:#b6c6d8;line-height:1.8}
  .mk-ansbody b{color:#e2ecf8}
  .mk-std{white-space:pre-line;margin-top:7px;padding-top:7px;border-top:1px solid #1e2a38;
    font-size:11.5px;color:#93a3b8}
  .mk-self{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#7d92aa}
  .mk-self .btn.on{background:#1c3350;border-color:#2f5480;color:#dbe9f8}
  .mk-end{text-align:center;margin:30px 0 10px}
  .mk-of{font-size:20px;color:#7d92aa;font-weight:400}

  /* ---------- 错题本 ---------- */
  .wlist{display:flex;flex-direction:column;gap:11px}
  .wcard{background:#111823;border:1px solid #22303f;border-left:3px solid #2f3d4f;border-radius:9px;padding:13px 15px}
  .wcard.late{border-left-color:#b3453a}
  .wt{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:10px;flex-wrap:wrap}
  .wsid{font-size:12.5px;font-weight:600;color:#dbe4f0}
  .wtag{font-size:10.5px;color:#7d92aa;background:#16202c;border:1px solid #26344a;border-radius:5px;padding:2px 7px;white-space:nowrap}
  .wtag.late{color:#e8a396;border-color:#5c2f28;background:#211512}
  .wq{font-size:13px;color:#c6d4e4;line-height:1.6;margin-bottom:6px}
  .wa{font-size:12px;color:#7ec8a2}
  .wd{margin-top:7px;font-size:12px;color:#8ba0b8}
  .wd summary{cursor:pointer;color:#7d92aa}
  .wd div{margin-top:6px;line-height:1.65;color:#b9c8d8}
  .wb{margin-top:9px}

  /* ---------- 真题 ---------- */
  .plist{display:flex;flex-direction:column;gap:9px}
  .pcard{display:flex;align-items:center;gap:14px;background:#111823;border:1px solid #22303f;border-radius:9px;padding:11px 14px;flex-wrap:wrap}
  .pyear{font-size:18px;font-weight:800;color:#7f93ab;flex:0 0 62px;letter-spacing:-1px}
  .pinfo{flex:1;min-width:180px}
  .pinfo .vtitle{margin-bottom:2px}
  .pinfo .vmeta{margin-bottom:0}
  /* ---------- 窄屏：详情做成底部抽屉 ---------- */
  /* 基础规则必须写在媒体查询之前：display:none 要是排在后面，会把媒体查询里的 block 盖掉 */
  .panel-grip{display:none;width:36px;height:4px;border-radius:2px;background:#3a4a5e;margin:0 auto 12px}
  .panel-close{display:none;position:absolute;right:14px;top:12px;width:26px;height:26px;
    align-items:center;justify-content:center;border-radius:50%;background:#1b2431;
    border:1px solid #2b3a4d;color:#93a3b8;font-size:13px;cursor:pointer;z-index:2}
  @media (max-width:1080px){
    /* 选择器要写成 aside#panel，才压得过基础规则里的 aside#panel{background:rgba(...,.6)} */
    aside#panel{position:fixed;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;
      width:auto;flex:none;border-radius:16px 16px 0 0;border-top:1px solid #2b3a4d;
      background:#11161f;box-shadow:0 -18px 40px -20px #000;
      transform:translateY(105%);transition:transform .24s ease;z-index:40}
    body.panel-open aside#panel{transform:translateY(0)}
    .panel-grip{display:block}
    .panel-close{display:flex}
  }

/* ---------- 手机 ---------- */
  /* 必须放在所有基础规则之后：同特异性下后写的赢，放前面会被覆盖掉 */
  @media (max-width:640px){
    .topbar{padding:10px 14px 8px;gap:9px}
    .brand h1{font-size:15px}
    .brand p{font-size:10.5px}
    .search-wrap{min-width:100%;order:3;max-width:none}
    .top-actions{gap:6px;font-size:11.5px}
    .top-actions .btn{padding:5px 9px;font-size:11.5px}
    main{padding:16px 14px 32px}
    aside#panel{padding:16px 14px}
    .sec-title h2{font-size:14px}
    .dom-grid{grid-template-columns:1fr}
    .dom-card .desc{min-height:auto}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi b{font-size:21px}
    /* 数据页的领域行：小屏改成两行，别硬挤四列 */
    .srow{grid-template-columns:78px 1fr 46px;
      grid-template-areas:"n m l" "b b b";row-gap:7px;padding:10px 12px}
    .sname{grid-area:n}
    .smeta{grid-area:m}
    .slit{grid-area:l}
    .sbar{grid-area:b}
    .qbox{padding:14px 14px}
    .qtext{font-size:13.5px}
    .opt{font-size:12.5px;padding:10px 11px}
    .player iframe{height:230px}
    .pcard{padding:10px 12px}
    .pyear{flex:0 0 46px;font-size:17px}
    .qr-score{font-size:50px}
    .quiz-result{margin:26px auto}
    /* 手机上纸边距收窄：390px 下原来内容区只剩 294px，标题折两行 */
    .paper{padding:20px 18px}
    .paper .phead h2{font-size:16px;letter-spacing:0}
    .paper .qt{font-size:14px}
    .paper .po{grid-template-columns:repeat(2,1fr)}
    #search{font-size:16px}   /* iOS 上小于 16px 会在聚焦时自动放大整页 */
    /* 「更多」在窄屏换行后要贴右，菜单才不会有一截跑到屏幕外 */
    .more-wrap{margin-left:auto}
    .more-menu{position:fixed;left:12px;right:12px;width:auto;min-width:0;top:auto}
    .fname{font-size:23px}
    .focus{padding:22px 20px}
    .fbtns{gap:8px}
    .btn.fprimary{font-size:14px;padding:11px 20px}
    /* 排行行：小屏时名字和领域一行，掌握标准和题型换到下一行，别把宽度挤爆 */
    .rank-row{flex-wrap:wrap;row-gap:5px;align-items:center}
    .rank-row .nm{min-width:0;flex:1 1 auto}
    .rank-row .dom{min-width:0;font-size:10.5px}
    .rank-row .how{flex:1 1 100%;white-space:normal;overflow:visible;text-overflow:clip;font-size:11px}
  }

  /* =========================================================
   *  视觉层级：页头独立 / KPI 横档 / 列表去卡片 / 提醒用暖色
   *  全是 CSS，DOM 一个节点没动，data.js / quiz.js / videos.js 没碰。
   *  注意：这块排在 640 媒体查询之后，所以自带一个 640 覆盖（见本块末尾）。
   * ========================================================= */

  /* 动作 A：页标题拉到 27px，上面压一条 34×3 的暖线。
     用 flex-wrap + h2 独占一行，不用 display:block —— 领域页那个
     「换成竖排列表」按钮靠 flex + margin-left:auto 才在右边，改 block 会掉到左下角。 */
  .crumbs{color:var(--txt3)}
  .crumbs+.sec-title{flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 22px}
  .crumbs+.sec-title h2{flex:1 1 100%;font-size:27px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
  .crumbs+.sec-title h2::before{content:"";display:block;width:34px;height:3px;
    background:#d69a3c;border-radius:2px;margin:0 0 12px}
  .crumbs+.sec-title > span{font-size:13px;color:#8494a8}

  /* 动作 B：四个 KPI 盒子并成一条仪表横档，靠细线分，不靠盒子分 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:2px;
    background:linear-gradient(180deg,#161f2b,#121a24);
    border:1px solid #232f3f;border-radius:12px}
  .kpi{background:none;border:0;border-right:1px solid #1e2938;border-radius:0;
    box-shadow:none;text-align:left;padding:14px 20px}
  .kpi:last-child{border-right:0}
  .kpi b{font-size:32px;letter-spacing:-1.6px;font-variant-numeric:tabular-nums;line-height:1.05}
  .kpi b span{font-size:13px;color:#8a9bb0}

  /* 动作 C：列表去卡片化。表格性质的东西用线分，一屏盒子从 10 个降到 2 个 */
  .slist .rank-row{background:transparent;border:0;border-bottom:1px solid #1a2331;
    border-radius:0;padding:13px 6px}
  .slist .rank-row:hover{background:#121a24}
  .srow{background:transparent;border:0;border-bottom:1px solid #1a2331;border-radius:0;padding:12px 6px}
  .srow:hover{background:#121a24}
  .weak-rate{font-size:19px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

  /* 提醒块用暖色：红留给「错」 */
  .advice{background:#1a1510;border:1px solid #3a2a1e;border-left:3px solid #d69a3c;
    font-size:13.5px;padding:12px 16px;color:#d9c0a8}

  /* 本块排在 640 之后，手机尺寸要在这里重新声明，否则 KPI 会停在 32px */
  @media (max-width:640px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi:nth-child(2n){border-right:0}
    .kpi:nth-child(-n+2){border-bottom:1px solid #1e2938}
    .kpi b{font-size:24px;letter-spacing:-1px}
    .crumbs+.sec-title h2{font-size:22px}
    /* 进度条那行字变长之后（加了覆盖分），手机上会顶出屏幕，允许换行 */
    .progressbar{flex-wrap:wrap;padding:7px 14px 8px;gap:6px}
    #pbar-text{white-space:normal;line-height:1.55;font-size:10.5px}
    .progressbar::before{display:none}
    #pbar-fill{position:static;margin:0;width:100%;max-width:100%;order:2}
  }

  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>广东 3+证书 <em>数学技能树</em></h1>
    <p id="exam-line">150 分 · 120 分钟 · 15 选择 + 5 填空 + 4 解答</p>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜知识点，比如：集合、数列、椭圆、复数">
  </div>
  <div class="top-actions">
    <button class="btn" id="btn-home" data-nav="home">领域总览</button>
    <button class="btn" id="btn-rank" data-nav="rank">重要度排行</button>
    <button class="btn" id="btn-wrong" data-nav="wrong">错题本<span class="badge" id="wrong-badge"></span></button>
    <button class="btn" id="btn-papers" data-nav="papers">真题</button>
    <button class="btn" id="btn-stats" data-nav="stats">数据</button>

    <div class="more-wrap" id="more-wrap">
      <button class="btn" id="btn-more">更多 ▾</button>
      <div class="more-menu">
        <button class="btn" id="btn-share">分享给同学</button>
        <button class="btn" id="btn-export">导出进度</button>
        <label class="btn" for="import-file">导入进度</label>
        <input type="file" id="import-file" accept=".json" hidden>
        <label class="more-check"><input type="checkbox" id="tgl-skip"> 显示可跳过项</label>
      </div>
    </div>
  </div>
</header>

<div class="progressbar"><div id="pbar-fill"></div><span id="pbar-text"></span></div>

<div class="layout">
  <main id="main"></main>
  <aside id="panel">
    <div class="empty">左边点一个技能<br><span>看它的前置、知识点、掌握标准和常见坑</span></div>
  </aside>
</div>

<footer id="foot"></footer>

<script src="data.js"></script>
<script src="soft-pre.js"></script>
<script src="videos.js"></script>
<script src="quiz.js"></script>
<script src="app.js"></script>
</body>
