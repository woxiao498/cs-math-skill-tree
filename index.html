<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广东 3+证书 数学技能树</title>
<style>
  :root{
    --bg:#0c1017; --bg2:#11161f; --panel:#141a24; --line:#232d3d;
    --txt:#dfe6f0; --txt2:#93a3b8; --txt3:#5f7085;
    --a:#e2604f; --b:#d69a3c; --c:#4f86c6; --d:#4a5566;
    --accent:#5b8fd6;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1000px 600px at 15% -10%, #16202e 0%, transparent 60%),
      radial-gradient(900px 500px at 95% 0%, #1a1526 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:16px 24px 12px;border-bottom:1px solid var(--line);
    background:rgba(12,16,23,.82);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:30;
  }
  .brand h1{margin:0;font-size:17px;letter-spacing:.4px;font-weight:650}
  .brand h1 em{font-style:normal;color:var(--accent)}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--txt3);letter-spacing:.3px}
  .search-wrap{flex:1;min-width:200px;max-width:380px}
  #search{
    width:100%;padding:7px 12px;border-radius:8px;
    background:#0e131b;border:1px solid var(--line);color:var(--txt);font-size:13px;
  }
  #search:focus{outline:none;border-color:var(--accent)}
  .top-actions{display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap}
  .btn{
    padding:6px 12px;border:1px solid var(--line);border-radius:7px;color:var(--txt2);
    background:#101620;transition:.15s;font-size:12.5px;
  }
  .btn:hover{border-color:#3a4d68;color:var(--txt)}
  .toggle{display:flex;align-items:center;gap:6px;color:var(--txt2);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}

  /* ---------- 进度条 ---------- */
  .progressbar{position:relative;height:26px;background:#0a0e14;border-bottom:1px solid var(--line)}
  #pbar-fill{height:100%;width:0;background:linear-gradient(90deg,#2c4a6e,#4d7fb8);transition:width .35s}
  #pbar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#c6d4e6;letter-spacing:.4px}

  /* ---------- 布局 ---------- */
  .layout{display:flex;align-items:stretch;min-height:calc(100vh - 122px)}
  main{flex:1;min-width:0;overflow:auto;padding:22px 24px 40px}
  aside#panel{
    width:392px;flex:0 0 392px;border-left:1px solid var(--line);
    background:rgba(16,21,29,.6);overflow:auto;padding:20px;
  }
  @media (max-width:1080px){
    .layout{flex-direction:column}
    aside#panel{width:auto;flex:none;border-left:none;border-top:1px solid var(--line)}
  }

  .sec-title{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
  .sec-title h2{margin:0;font-size:15px;font-weight:620}
  .sec-title span{font-size:12px;color:var(--txt3)}
  .crumbs{font-size:12px;color:var(--txt3);margin-bottom:16px;display:flex;gap:8px;align-items:center}
  .crumbs a{color:var(--txt2);text-decoration:none;cursor:pointer}
  .crumbs a:hover{color:var(--accent)}

  /* ---------- 领域总览 ---------- */
  .dom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
  .dom-card{
    position:relative;padding:15px 16px 13px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#151b26,#121821);border:1px solid var(--line);
    transition:.18s;overflow:hidden;
  }
  .dom-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dc);opacity:.75}
  .dom-card:hover{border-color:#33445c;transform:translateY(-2px);box-shadow:0 10px 26px -14px #000}
  .dom-card h3{margin:0 0 3px;font-size:14.5px;font-weight:620;color:#e8eef7}
  .dom-card .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--txt3);margin-bottom:8px;flex-wrap:wrap}
  .dom-card .desc{font-size:12px;color:var(--txt2);line-height:1.55;min-height:54px}
  .dom-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--txt3)}
  .mini-bar{height:3px;border-radius:2px;background:#0c1119;flex:1;margin:0 10px;overflow:hidden}
  .mini-bar i{display:block;height:100%;background:var(--dc);width:0}

  .rank-badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:19px;height:19px;padding:0 5px;border-radius:5px;
    font-size:10.5px;font-weight:700;letter-spacing:.3px;
  }
  .lv-A{background:rgba(226,96,79,.16);color:var(--a);border:1px solid rgba(226,96,79,.35)}
  .lv-B{background:rgba(214,154,60,.14);color:var(--b);border:1px solid rgba(214,154,60,.3)}
  .lv-C{background:rgba(79,134,198,.14);color:var(--c);border:1px solid rgba(79,134,198,.3)}
  .lv-D{background:rgba(74,85,102,.2);color:#7c8ba1;border:1px solid rgba(74,85,102,.4)}

  .tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#1b2431;color:var(--txt3);border:1px solid #26313f}
  .tag.q{color:#8fa8c4;border-color:#2c3a4d}

  /* ---------- 地图 ---------- */
  .map-wrap{position:relative;overflow:auto;border:1px solid var(--line);border-radius:12px;
    background:
      linear-gradient(#0e131b,#0e131b),
      radial-gradient(circle at 20% 20%, #1a2433, transparent 40%);
    background-blend-mode:normal;
  }
  .map-inner{position:relative}
  svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .edge{fill:none;stroke:#2b3646;stroke-width:1.4;transition:.2s}
  .edge.soft{stroke-dasharray:4 5;stroke:#212a38}
  .edge.hl-hard{stroke:#5b8fd6;stroke-width:2.4}
  .edge.hl-soft{stroke:#5b8fd6;stroke-width:2;stroke-dasharray:4 5;opacity:.8}

  .step-head{position:absolute;font-size:10.5px;color:var(--txt3);letter-spacing:1px}
  .step-head b{color:#7f93ab;font-weight:600}

  .node{
    position:absolute;border-radius:9px;padding:8px 10px;cursor:pointer;
    background:#161d28;border:1px solid #2a3646;
    transition:.16s;display:flex;flex-direction:column;justify-content:center;gap:2px;
    overflow:hidden;
  }
  .node:hover{border-color:#41546e;background:#1a2230}
  .node .nm{font-size:11.5px;font-weight:600;color:#dbe4f0;line-height:1.26;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .node .sub{font-size:10px;color:var(--txt3);display:flex;gap:5px;align-items:center}
  .node .dot{position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;background:#2f3b4d}
  .node.lit{background:linear-gradient(160deg,#17253a,#14202f);border-color:var(--nc);box-shadow:0 0 0 1px rgba(91,143,214,.25),0 8px 20px -12px var(--nc)}
  .node.lit .dot{background:var(--nc);box-shadow:0 0 8px var(--nc)}
  .node.locked .nm{color:#7d8ca0}
  .node.locked{border-style:dashed}
  .node.sel{border-color:#8fb4e8 !important;box-shadow:0 0 0 2px rgba(143,180,232,.35),0 0 22px -4px #4d7fb8}
  .node.hl{border-color:#4d7fb8}
  .node.dimmed{opacity:.24}
  .node.skippable{opacity:.45}
  .node .ext{position:absolute;left:8px;bottom:4px;font-size:9px;color:#4a5c73}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--txt3);margin:0 0 14px}
  .legend i{display:inline-block;width:22px;height:0;border-top:2px solid #33415a;vertical-align:middle;margin-right:5px}
  .legend i.dash{border-top-style:dashed}

  /* ---------- 排行 ---------- */
  .rank-row{
    display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;
    border:1px solid transparent;cursor:pointer;transition:.12s;
  }
  .rank-row:hover{background:#141b26;border-color:#28344a}
  .rank-row .nm{font-size:13px;font-weight:560;color:#dbe4f0;min-width:190px}
  .rank-row .dom{font-size:11px;color:var(--txt3);min-width:76px}
  .rank-row .how{font-size:11.5px;color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-group{margin:0 0 8px;font-size:12px;color:var(--txt3);padding:14px 4px 6px;border-bottom:1px solid #1b2431;display:flex;gap:8px;align-items:center}

  /* ---------- 清单 ---------- */
  .plan-list{counter-reset:step}
  .plan-item{display:flex;gap:12px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid #161e29}
  .plan-item .no{
    flex:0 0 26px;height:26px;border-radius:50%;background:#141d2a;border:1px solid #26313f;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#8496ad;font-weight:600;
  }
  .plan-item.done .no{background:#1b3a2c;border-color:#2e6b4d;color:#7ed4a3}
  .plan-item .body{flex:1}
  .plan-item .t{font-size:13px;color:#dbe4f0;font-weight:550}
  .plan-item .d{font-size:11px;color:var(--txt3);margin-top:1px}

  /* ---------- 详情面板 ---------- */
  .empty{color:var(--txt3);font-size:12.5px;text-align:center;padding:60px 20px;line-height:2}
  .empty span{font-size:11px;color:#4a5566}
  .p-head{margin:0 0 4px;font-size:16px;font-weight:650;color:#eaf0f8;line-height:1.35}
  .p-domain{font-size:11.5px;color:var(--txt3);margin-bottom:14px}
  .p-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .p-sec{margin:18px 0 8px;font-size:11px;letter-spacing:1.2px;color:#5f7085;text-transform:uppercase}
  .p-body{font-size:12.8px;color:#b9c6d8;line-height:1.72}
  .pts{margin:0;padding-left:0;list-style:none}
  .pts li{position:relative;padding-left:15px;margin-bottom:5px;font-size:12.8px;color:#c3cfe0}
  .pts li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--nc,#4a5c73)}
  .p-how{background:#101924;border:1px solid #22344a;border-left:2px solid var(--accent);
    border-radius:6px;padding:9px 11px;font-size:12.4px;color:#c9d8ea}
  .tip{background:#1a1512;border:1px solid #3a2a1e;border-left:2px solid #b5763c;
    border-radius:6px;padding:9px 11px;font-size:12.4px;color:#d9c0a8}
  .pre-chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:11.5px;padding:3px 9px;border-radius:14px;background:#141d29;
    border:1px solid #263243;color:#9db0c7;cursor:pointer;transition:.12s;
  }
  .chip:hover{border-color:#3d5470;color:#d6e3f2}
  .chip.ok{border-color:#2e6b4d;color:#7ed4a3;background:#101d17}
  .chip.miss{border-color:#6b3a34;color:#d69a8a;background:#1c1310}
  .chip.soft{border-style:dashed}
  .p-actions{display:flex;gap:8px;margin:20px 0 6px;flex-wrap:wrap}
  .p-actions .btn{flex:1;text-align:center;padding:9px 12px}
  .btn.lit{background:#1b3a2c;border-color:#2e6b4d;color:#8fe0b3}
  .btn.primary{background:#1c3350;border-color:#2f5480;color:#a9cbef}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .unsure{font-size:11.5px;color:#c9a86a;background:#1a1710;border:1px solid #3a3220;
    border-radius:6px;padding:8px 10px;margin-top:14px;line-height:1.6}

  footer{
    padding:14px 24px 22px;border-top:1px solid var(--line);
    font-size:11px;color:#4d5d72;line-height:1.9;background:#0a0e14;
  }
  footer a{color:#6a819c}
  .kbd{font-size:10.5px;padding:1px 5px;border:1px solid #2a3646;border-radius:4px;color:#8496ad}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>广东 3+证书 <em>数学技能树</em></h1>
    <p id="exam-line">150 分 · 120 分钟 · 15 选择 + 5 填空 + 4 解答</p>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜知识点，比如：韦达、诱导公式、渐近线、分层抽样">
  </div>
  <div class="top-actions">
    <button class="btn" id="btn-home">领域总览</button>
    <button class="btn" id="btn-rank">重要度排行</button>
    <button class="btn" id="btn-export">导出进度</button>
    <label class="btn" for="import-file">导入进度</label>
    <input type="file" id="import-file" accept=".json" hidden>
    <label class="toggle"><input type="checkbox" id="tgl-skip"> 显示可跳过项</label>
  </div>
</header>

<div class="progressbar"><div id="pbar-fill"></div><span id="pbar-text"></span></div>

<div class="layout">
  <main id="main"></main>
  <aside id="panel">
    <div class="empty">左边点一个技能<br><span>看它的前置、知识点、掌握标准和常见坑</span></div>
  </aside>
</div>

<footer id="foot"></footer>

<script src="data.js"></script>
<script src="soft-pre.js"></script>
<script>
/* =======================================================================
 *  基础索引与图算法
 * ======================================================================= */
const byId = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const domById = Object.fromEntries(DOMAINS.map(d => [d.id, d]));
const LV_ORDER = { A: 0, B: 1, C: 2, D: 3 };

/* 数据里到处是不等号和大于号（−1<x<4、0<a<1），直接塞进 innerHTML 会被
 * 浏览器当成标签起始吞掉。比如「写出 −1<x<4」会变成「写出 −1」。
 * 所以在进页面之前先把正文类字段转义一遍。技能名不含符号，不用动。 */
const escHtml = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
SKILLS.forEach(s => {
  s.how = escHtml(s.how);
  if (s.tip) s.tip = escHtml(s.tip);
  if (s.unsure) s.unsure = escHtml(s.unsure);
  s.pts = (s.pts || []).map(escHtml);
});
DOMAINS.forEach(d => {
  d.desc = escHtml(d.desc);
  d.score = escHtml(d.score);
  if (d.unsure) d.unsure = escHtml(d.unsure);
});

const STEP_TEXT = ['', '第一步 · 零门槛', '第二步', '第三步', '第四步', '第五步', '第六步', '第七步', '第八步'];

function softOf(id){ return SOFT_PRE[id] || []; }
function isSoft(child, parent){ return softOf(child).includes(parent); }
function hardPre(id){ return (byId[id].pre || []).filter(p => !isSoft(id, p)); }
function allPre(id){ return byId[id].pre || []; }

/* 最长前置链深度 = 这一步排在第几步 */
const _stepMemo = {};
function stepOf(id, guard){
  if (_stepMemo[id]) return _stepMemo[id];
  guard = guard || new Set();
  if (guard.has(id)) return 1;              // 理论上无环，防御一下
  guard.add(id);
  const hard = hardPre(id);
  const v = hard.length ? 1 + Math.max(...hard.map(p => stepOf(p, guard))) : 1;
  guard.delete(id);
  _stepMemo[id] = v;
  return v;
}

/* 所有祖先（含软前置），用于"整条前置链亮起来" */
function ancestry(id){
  const out = new Set();
  (function walk(x){
    allPre(x).forEach(p => { if (!out.has(p)) { out.add(p); walk(p); } });
  })(id);
  return out;
}

/* 下游：谁把当前技能当必须前置 */
function downstream(id){
  return SKILLS.filter(s => hardPre(s.id).includes(id)).map(s => s.id);
}

/* =======================================================================
 *  状态
 * ======================================================================= */
const KEY = 'gd-math-skill-tree-v1';
const state = {
  view: 'home',
  domainId: null,
  selected: null,
  goal: null,
  query: '',
  qFilter: '',
  showSkippable: false,
  lit: new Set()
};

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      lit: [...state.lit], goal: state.goal, showSkippable: state.showSkippable
    }));
  }catch(e){ /* file:// 下个别浏览器禁写，忽略，进度仍存在内存里 */ }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    (d.lit || []).forEach(x => byId[x] && state.lit.add(x));
    state.goal = d.goal && byId[d.goal] ? d.goal : null;
    state.showSkippable = !!d.showSkippable;
  }catch(e){}
}

function visibleSkills(){
  return SKILLS.filter(s => state.showSkippable || s.lv !== 'D');
}
function isUnlocked(id){
  return hardPre(id).every(p => state.lit.has(p));
}
function missingPre(id){
  return hardPre(id).filter(p => !state.lit.has(p));
}

/* =======================================================================
 *  进度
 * ======================================================================= */
function renderProgress(){
  const vis = visibleSkills();
  const done = vis.filter(s => state.lit.has(s.id)).length;
  const pct = vis.length ? Math.round(done / vis.length * 100) : 0;
  document.getElementById('pbar-fill').style.width = pct + '%';
  document.getElementById('pbar-text').textContent =
    `已点亮 ${done} / ${vis.length} 个技能 · ${pct}%`;
}

/* =======================================================================
 *  视图：领域总览
 * ======================================================================= */
function renderHome(){
  const vis = visibleSkills();
  const cards = DOMAINS.map(d => {
    const ds = vis.filter(s => s.d === d.id);
    const total = SKILLS.filter(s => s.d === d.id).length;
    const litN = ds.filter(s => state.lit.has(s.id)).length;
    const pct = total ? Math.round(litN / total * 100) : 0;
    const hidden = total - ds.length;
    // 跨领域前置数量：线越粗=依赖越多，这里落成一个数字
    const ext = new Set();
    SKILLS.filter(s => s.d === d.id).forEach(s =>
      allPre(s.id).forEach(p => { if (byId[p].d !== d.id) ext.add(p); }));
    return `
      <div class="dom-card" data-dom="${d.id}" style="--dc:${d.color}">
        <h3>${d.name}</h3>
        <div class="meta">
          <span class="rank-badge lv-${d.lv}">${d.lv}</span>
          <span>${d.score}</span>
        </div>
        <div class="desc">${d.desc}</div>
        <div class="foot">
          <span>${litN}/${total} 已点亮${hidden ? ` · 含 ${hidden} 个可跳过` : ''}</span>
          <span class="mini-bar"><i style="width:${pct}%"></i></span>
          <span>${ext.size ? `外部前置 ${ext.size}` : '入口'}</span>
        </div>
      </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="sec-title">
      <h2>${DOMAINS.length} 个领域</h2>
      <span>从地基排到末题，不是按教材章节顺序</span>
    </div>
    <div class="dom-grid">${cards}</div>
    <div style="margin-top:26px;font-size:12px;color:#5f7085;line-height:1.9">
      卡上的 <b style="color:#93a3b8">A/B/C/D</b> 是这块在往年卷面里的分量，不是教材要求。<br>
      想看"每一分该花在哪"，去上面的 <b style="color:#93a3b8">重要度排行</b>。
    </div>`;
}

/* =======================================================================
 *  视图：领域地图
 * ======================================================================= */
function renderDomain(domId){
  const d = domById[domId];
  const vis = visibleSkills().filter(s => s.d === domId);
  const hiddenCount = SKILLS.filter(s => s.d === domId).length - vis.length;

  if (!vis.length){
    document.getElementById('main').innerHTML = `<div class="empty">这个领域目前没有可显示的技能</div>`;
    return;
  }

  // 按步分列
  const byStep = {};
  vis.forEach(s => { const st = stepOf(s.id); (byStep[st] = byStep[st] || []).push(s); });
  const steps = Object.keys(byStep).map(Number).sort((a, b) => a - b);

  const COLW = 198, ROWH = 96, PADX = 24, PADY = 48, W = 174, H = 68;
  const pos = {};
  const maxRows = Math.max(...steps.map(st => byStep[st].length));

  // 同一列里按"父节点平均高度"排序，线就不容易交叉
  const parentY = s => {
    const ys = allPre(s.id).filter(p => pos[p]).map(p => pos[p].y);
    return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : -1;
  };
  steps.forEach((st, ci) => {
    const items = byStep[st];
    if (ci > 0) items.sort((a, b) => parentY(a) - parentY(b));
    items.forEach((s, ri) => {
      pos[s.id] = { x: PADX + ci * COLW, y: PADY + ri * ROWH };
    });
  });
  const width = PADX * 2 + (steps.length - 1) * COLW + W;
  const height = PADY + maxRows * ROWH + 20;

  const sel = state.selected;
  const ancSet = sel ? ancestry(sel) : new Set();
  const kids = sel ? new Set(downstream(sel)) : new Set();

  // 连线（只画本领域内部的边）
  let edges = '';
  vis.forEach(s => {
    allPre(s.id).forEach(p => {
      if (!pos[p]) return;                 // 跨领域前置不在地图里
      const a = pos[p], b = pos[s.id];
      const soft = isSoft(s.id, p);
      let cls = 'edge' + (soft ? ' soft' : '');
      if (sel){
        const onChain = (s.id === sel || ancSet.has(s.id)) && (p === sel || ancSet.has(p));
        const direct = (s.id === sel) || (p === sel);
        if (onChain || direct) cls += soft ? ' hl-soft' : ' hl-hard';
      }
      edges += `<path class="${cls}" d="M${a.x + W} ${a.y + H / 2} C${a.x + W + 60} ${a.y + H / 2}, ${b.x - 60} ${b.y + H / 2}, ${b.x} ${b.y + H / 2}"/>`;
    });
  });

  // 节点
  const nodes = vis.map(s => {
    const p0 = pos[s.id];
    const lit = state.lit.has(s.id);
    const unlocked = isUnlocked(s.id);
    const extPre = allPre(s.id).filter(p => !pos[p]);
    let cls = 'node';
    if (s.lv === 'D') cls += ' skippable';
    if (lit) cls += ' lit'; else if (!unlocked) cls += ' locked';
    if (s.id === sel) cls += ' sel';
    else if (sel && (ancSet.has(s.id) || kids.has(s.id))) cls += ' hl';
    else if (sel) cls += ' dimmed';
    const q = (s.q || []).length ? s.q.join('·') : '可不学';
    return `
      <div class="${cls}" data-skill="${s.id}"
           style="left:${p0.x}px;top:${p0.y}px;width:${W}px;height:${H}px;--nc:${d.color}">
        <span class="dot"></span>
        <div class="nm">${s.n}</div>
        <div class="sub"><span class="rank-badge lv-${s.lv}" style="height:15px;min-width:15px;font-size:9px">${s.lv}</span><span>${q}</span></div>
      </div>`;
  }).join('');

  const heads = steps.map((st, ci) => {
    const label = STEP_TEXT[st] || `第${st}步`;
    return `<div class="step-head" style="left:${PADX + ci * COLW}px;top:14px"><b>${label}</b></div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="crumbs"><a data-go="home">领域总览</a> / <span>${d.name}</span></div>
    <div class="sec-title">
      <h2 style="color:${d.color}">${d.name}</h2>
      <span>${vis.filter(s => state.lit.has(s.id)).length}/${SKILLS.filter(s => s.d === d.id).length} 已点亮 · 最远到第 ${Math.max(...vis.map(s => stepOf(s.id)))} 步${hiddenCount ? ` · 已折叠 ${hiddenCount} 个可跳过项` : ''}</span>
    </div>
    <div class="legend">
      <span><i></i>必须前置（不点亮就锁着）</span>
      <span><i class="dash"></i>推荐前置（没有也能学，会更吃力）</span>
      <span><span class="kbd">点节点</span> 亮出整条前置链</span>
    </div>
    <div class="legend" style="margin-top:-8px">
      <span>步数按整棵树算 —— 某个技能的第一课可能落在别的领域，所以这里的起点不一定是第一步。</span>
    </div>
    ${domId === 'prep' ? `<div class="unsure" style="margin:0 0 14px">这一层不出独立考题，所以重要度对这里没有意义 —— 九条全都得会，缺哪条后面都会塌。</div>` : ''}
    <div class="map-wrap" style="height:${height + 40}px">
      <div class="map-inner" style="width:${width}px;height:${height}px">
        <svg class="edges" width="${width}" height="${height}">${edges}</svg>
        ${heads}
        ${nodes}
      </div>
    </div>`;
}

/* =======================================================================
 *  视图：重要度排行
 * ======================================================================= */
function renderRank(){
  const qf = state.qFilter;
  let vis = visibleSkills().slice();
  if (qf) vis = vis.filter(s => (s.q || []).includes(qf));
  vis.sort((a, b) => {
    const d = LV_ORDER[a.lv] - LV_ORDER[b.lv];
    if (d) return d;
    return DOMAINS.findIndex(x => x.id === a.d) - DOMAINS.findIndex(x => x.id === b.d);
  });

  const groupName = { A: 'A · 主力，每年必考', B: 'B · 常考，每年 1~2 题', C: 'C · 边缘，隔年出现', D: 'D · 可跳过，别花时间' };
  const qfBtn = (v, label) =>
    `<button class="btn ${state.qFilter === v ? 'primary' : ''}" data-qf="${v || ''}">${label}</button>`;

  let html = `<div class="crumbs"><a data-go="home">领域总览</a> / <span>重要度排行</span></div>
    <div class="sec-title"><h2>按往年卷面分量排的</h2><span>共 ${vis.length} 个技能${qf ? `（只看${qf}题）` : ''} · 点一行看详情</span></div>
    <div class="legend" style="align-items:center;gap:10px">
      ${qfBtn('', '全部')} ${qfBtn('选择', '选择题')} ${qfBtn('填空', '填空题')} ${qfBtn('解答', '解答题')}
      <span style="margin-left:8px">分值口径：2014~2024 各板块平均分值 + 近年真题逐题评述，不是考纲的"了解/理解/掌握"</span>
    </div>`;

  let cur = null;
  vis.forEach(s => {
    if (s.lv !== cur){
      cur = s.lv;
      html += `<div class="rank-group"><span class="rank-badge lv-${cur}">${cur}</span>${groupName[cur]}</div>`;
    }
    const d = domById[s.d];
    const q = (s.q || []).length ? s.q.map(x => `<span class="tag q">${x}</span>`).join(' ') : '<span class="tag">不考</span>';
    html += `<div class="rank-row" data-skill="${s.id}">
      <span class="rank-badge lv-${s.lv}">${s.lv}</span>
      <span class="nm">${s.n}</span>
      <span class="dom" style="color:${d.color}88">${d.short}</span>
      <span class="how">${s.how}</span>
      <span style="display:flex;gap:4px">${q}</span>
    </div>`;
  });

  document.getElementById('main').innerHTML = html;
}

/* =======================================================================
 *  视图：搜索结果
 * ======================================================================= */
function renderSearch(){
  const q = state.query.trim().toLowerCase();
  const hits = visibleSkills().filter(s => {
    const hay = [s.n, s.how, s.tip, domById[s.d].name, ...(s.pts || [])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  if (!hits.length){
    document.getElementById('main').innerHTML =
      `<div class="empty">没搜到「${state.query}」<br><span>换个说法试试，比如只搜两个字</span></div>`;
    return;
  }
  const rows = hits.map(s => {
    const d = domById[s.d];
    return `<div class="rank-row" data-skill="${s.id}">
      <span class="rank-badge lv-${s.lv}">${s.lv}</span>
      <span class="nm">${s.n}</span>
      <span class="dom" style="color:${d.color}88">${d.short}</span>
      <span class="how">${s.how}</span>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML =
    `<div class="sec-title"><h2>「${state.query}」的 ${hits.length} 个结果</h2></div>${rows}`;
}

/* =======================================================================
 *  视图：学习清单（目标模式）
 * ======================================================================= */
function renderPlan(){
  if (!state.goal || !byId[state.goal]){
    document.getElementById('main').innerHTML =
      `<div class="empty">还没设目标<br><span>点开任意技能，按「设为目标」，这里会排出学习顺序</span></div>`;
    return;
  }
  const g = byId[state.goal];
  const need = new Set([g.id, ...ancestry(g.id)]);
  const list = [...need].sort((a, b) => {
    const d = stepOf(a) - stepOf(b);
    return d || (LV_ORDER[byId[a].lv] - LV_ORDER[byId[b].lv]);
  });
  const done = list.filter(id => state.lit.has(id)).length;
  const aCount = list.filter(id => byId[id].lv === 'A').length;

  const items = list.map((id, i) => {
    const s = byId[id];
    const d = domById[s.d];
    const lit = state.lit.has(id);
    return `<div class="plan-item ${lit ? 'done' : ''}" data-skill="${id}">
      <div class="no">${lit ? '✓' : i + 1}</div>
      <div class="body">
        <div class="t">${s.n} <span class="rank-badge lv-${s.lv}" style="height:15px;min-width:15px;font-size:9px">${s.lv}</span></div>
        <div class="d">${d.name} · 第 ${stepOf(id)} 步 · ${(s.q || []).join('/') || '可不学'}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="crumbs"><a data-go="home">领域总览</a> / <span>学习清单</span></div>
    <div class="sec-title">
      <h2>目标：${g.n}</h2>
      <span>要 ${list.length} 个技能，已完成 ${done} 个，其中 A 级 ${aCount} 个</span>
    </div>
    <div class="legend"><span>顺序是自动排的：永远先排前置，同一层里 A 级优先</span></div>
    <div class="plan-list">${items}</div>`;
}

/* =======================================================================
 *  详情面板
 * ======================================================================= */
function renderPanel(){
  const panel = document.getElementById('panel');
  const id = state.selected;
  if (!id || !byId[id]){
    panel.innerHTML = `<div class="empty">左边点一个技能<br><span>看它的前置、知识点、掌握标准和常见坑</span></div>`;
    return;
  }
  const s = byId[id];
  const d = domById[s.d];
  const lit = state.lit.has(id);
  const unlocked = isUnlocked(id);
  const miss = missingPre(id);
  const softs = softOf(id);
  const kids = downstream(id);

  const pts = (s.pts || []).map(p => `<li>${p}</li>`).join('');
  const qTags = (s.q || []).map(x => `<span class="tag q">${x}题</span>`).join(' ') || '<span class="tag">不考</span>';

  const preChips = (s.pre || []).length
    ? s.pre.map(p => {
        const soft = softs.includes(p);
        const ok = state.lit.has(p);
        return `<span class="chip ${ok ? 'ok' : 'miss'} ${soft ? 'soft' : ''}" data-skill="${p}"
          title="${soft ? '推荐前置' : '必须前置'}">${state.lit.has(p) ? '✓' : '·'} ${byId[p].n}${soft ? ' (推荐)' : ''}</span>`;
      }).join('')
    : '<span style="font-size:12px;color:#5f7085">无前置，这是起点</span>';

  const kidChips = kids.length
    ? kids.map(k => `<span class="chip" data-skill="${k}">${byId[k].n}</span>`).join('')
    : '<span style="font-size:12px;color:#5f7085">没有必修它的下游</span>';

  panel.innerHTML = `
    <div class="p-head">${s.n}</div>
    <div class="p-domain" style="color:${d.color}">${d.name} · 第 ${stepOf(id)} 步</div>
    <div class="p-row">
      <span class="rank-badge lv-${s.lv}">${s.lv}</span>
      <span style="font-size:11.5px;color:#93a3b8">${({A:'主力，必考',B:'常考',C:'边缘',D:'可跳过'})[s.lv]}</span>
      ${qTags}
    </div>

    <div class="p-sec">知识点</div>
    <ul class="pts" style="--nc:${d.color}">${pts || '<li>（无）</li>'}</ul>

    <div class="p-sec">掌握到什么程度</div>
    <div class="p-how">${s.how}</div>

    ${s.tip ? `<div class="p-sec">坑在哪</div><div class="tip">${s.tip}</div>` : ''}

    ${s.unsure ? `<div class="unsure">⚠ ${s.unsure}</div>` : ''}

    <div class="p-sec">前置</div>
    <div class="pre-chips">${preChips}</div>
    ${miss.length ? `<div style="font-size:11.5px;color:#d69a8a;margin-top:8px">还差 ${miss.map(m => byId[m].n).join('、')} 没点亮，这个技能现在是锁着的。</div>` : ''}

    <div class="p-sec">点亮它能解锁</div>
    <div class="pre-chips">${kidChips}</div>

    <div class="p-actions">
      <button class="btn ${lit ? 'lit' : 'primary'}" data-act="toggle" ${(!lit && !unlocked) ? 'disabled' : ''}>
        ${lit ? '已点亮 · 点此取消' : (unlocked ? '点亮它' : '前置没齐，先别点')}
      </button>
      <button class="btn" data-act="goal">设为目标</button>
    </div>
    ${state.goal === id ? `<div style="font-size:11.5px;color:#7ed4a3;margin-top:6px">当前目标就是它</div>` : ''}
  `;
}

/* =======================================================================
 *  渲染总入口
 * ======================================================================= */
function renderMain(){
  if (state.query.trim()) { renderSearch(); return; }
  if (state.view === 'domain') return renderDomain(state.domainId);
  if (state.view === 'rank') return renderRank();
  if (state.view === 'plan') return renderPlan();
  return renderHome();
}
function render(){
  renderMain();
  renderPanel();
  renderProgress();
  syncHash();
}

/* 让某个领域/视图可以直接用链接打开（也方便分享给同学） */
function syncHash(){
  let h = '';
  if (!state.query.trim()){
    if (state.view === 'domain' && state.domainId) h = '#' + state.domainId;
    else if (state.view === 'rank') h = '#rank';
    else if (state.view === 'plan') h = '#plan';
  }
  if (location.hash === h) return;
  try{ history.replaceState(null, '', location.pathname + location.search + h); }
  catch(e){ location.hash = h; }
}

/* =======================================================================
 *  事件
 * ======================================================================= */
document.getElementById('main').addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go){
    state.view = go.dataset.go === 'home' ? 'home' : go.dataset.go;
    state.query = ''; document.getElementById('search').value = '';
    render(); return;
  }
  const qf = e.target.closest('[data-qf]');
  if (qf){
    state.qFilter = qf.dataset.qf || '';
    state.view = 'rank';
    render(); return;
  }
  const dom = e.target.closest('[data-dom]');
  if (dom){
    state.view = 'domain'; state.domainId = dom.dataset.dom;
    state.selected = null; render();
    window.scrollTo({ top: 0 });
    return;
  }
  const sk = e.target.closest('[data-skill]');
  if (sk){ selectSkill(sk.dataset.skill); }
});

document.getElementById('panel').addEventListener('click', e => {
  const chip = e.target.closest('[data-skill]');
  if (chip && !e.target.closest('[data-act]')){ selectSkill(chip.dataset.skill); return; }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const id = state.selected;
  if (act.dataset.act === 'toggle'){
    if (state.lit.has(id)) {
      // 取消点亮时，把依赖它的下游一起收回去，否则会出现"锁着的技能却亮着"
      const lost = [];
      const stack = [id];
      while (stack.length){
        const cur = stack.pop();
        if (state.lit.delete(cur)) lost.push(cur);
        downstream(cur).forEach(k => { if (state.lit.has(k)) stack.push(k); });
      }
      const extra = lost.filter(x => x !== id);
      if (extra.length){
        setTimeout(() => alert(`已经连同 ${extra.length} 个下游技能一起收回了：\n${extra.map(x => byId[x].n).join('、')}`), 30);
      }
    } else if (isUnlocked(id)) {
      state.lit.add(id);
    }
    save(); render();
  }
  if (act.dataset.act === 'goal'){
    state.goal = id; state.view = 'plan'; state.selected = null;
    save(); render();
  }
});

function selectSkill(id){
  state.selected = id;
  // 选中跨领域前置时，把地图切到它的领域，不然节点不在图上
  if (state.view === 'domain' && state.domainId !== byId[id].d){
    state.view = 'domain';
  }
  if (state.view === 'domain') state.domainId = byId[id].d;
  render();
}

document.getElementById('btn-home').onclick = () => {
  state.view = 'home'; state.query = ''; document.getElementById('search').value = '';
  state.selected = null; render();
};
document.getElementById('btn-rank').onclick = () => {
  state.view = 'rank'; state.query = ''; document.getElementById('search').value = '';
  state.selected = null; render();
};

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => {
    state.query = v;
    renderMain();
  }, 120);
});

document.getElementById('tgl-skip').addEventListener('change', e => {
  state.showSkippable = e.target.checked;
  save(); render();
});

document.getElementById('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify({
    lit: [...state.lit], goal: state.goal,
    exportedAt: new Date().toISOString().slice(0, 10)
  }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `广东3+证书数学技能树_进度_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

document.getElementById('import-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      state.lit = new Set((d.lit || []).filter(x => byId[x]));
      state.goal = d.goal && byId[d.goal] ? d.goal : null;
      save(); render();
    }catch(err){ alert('这个文件读不出来，确认是从这里导出的进度文件。'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* =======================================================================
 *  启动
 * ======================================================================= */
load();
document.getElementById('tgl-skip').checked = state.showSkippable;

/* 调试/演示钩子：index.html?lit=g1,p6&sel=g11 预置点亮与选中，方便截图核对 */
(function demoHook(){
  const q = location.search.replace(/^\?/, '');
  if (!q) return;
  const p = new URLSearchParams(q);
  const lit = p.get('lit');
  if (lit) lit.split(',').forEach(x => { if (byId[x]) state.lit.add(x); });
  const sel = p.get('sel');
  if (sel && byId[sel]) state.selected = sel;
  const goal = p.get('goal');
  if (goal && byId[goal]) state.goal = goal;
  if (p.has('qf')) state.qFilter = p.get('qf');
})();


/* 支持 #geo 这种直接进入某个领域 */
(function applyHash(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')).trim();
  if (!h || h === 'home') return;
  if (domById[h]) { state.view = 'domain'; state.domainId = h; return; }
  if (h === 'rank') { state.view = 'rank'; return; }
  if (h === 'plan') { state.view = 'plan'; return; }
})();

document.getElementById('exam-line').textContent =
  `${EXAM.total} 分 · ${EXAM.minutes} 分钟 · 15 选择 + 5 填空 + 4 解答`;
document.getElementById('foot').innerHTML = `
  广东 3+证书（高职高考）数学技能树 · ${SKILLS.length} 个技能 / ${DOMAINS.length} 个领域<br>
  卷面结构依据 2021 版《数学科考试说明》（2021 年起考试院不再公布新考纲，命题依据为《中等职业学校数学课程标准（2020 年版）》）。<br>
  重要度按 2014~2024 各板块平均分值统计与近年真题逐题评述排定。凡标注「存疑」的地方，说明我没能拿到原卷核实 —— 别当结论用。<br>
  进度存在本机浏览器里；换设备用「导出 / 导入」。
`;

render();
</script>
